[project]
name = "tabpfn-proofread"
version = "0.3.0"
description = "Spellcheck for tables: find and fix suspicious cells and labels with TabPFN-3.5"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["tabpfn==9.1.0", "scikit-learn==1.9.1", "pandas==3.0.6", "numpy==2.5.3", "openml==0.15.1", "scipy==1.18.1", "textual>=8.2,<9"]

[project.scripts]
tablint = "proofread.cli:main"
proofread = "proofread.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
proofread = ["static/*.js", "static/*.css"]

[tool.setuptools]
packages = ["proofread", "benchmarks"]

[project.optional-dependencies]
demo = ["streamlit>=1.40,<2"]
agent = ["mcp>=1.12,<2"]
baselines = ["tabpfn-extensions[unsupervised]==0.6.3"]
notebook = ["anywidget>=0.11,<0.12", "ipykernel>=6.29", "jupyterlab>=4.4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
