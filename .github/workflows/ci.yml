name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra notebook --extra demo
      - run: uv run pytest -q tests
      - run: uv run --extra notebook tablint demo --prepare-only
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-proofread/package-lock.json
      - run: npm run demo:vscode -- --prepare-only
      - run: npm test
        working-directory: vscode-proofread
      - run: xvfb-run -a npm run test:integration
        working-directory: vscode-proofread
  notebook-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm test
        working-directory: tests/js
